import java.util.regex.Pattern

def kineticApiRoot = file('src/main/java/dev/xyat/kineticcore/api')
def kineticApiPackage = 'dev.xyat.kineticcore.api'
def kineticInternalPackage = 'dev.xyat.kineticcore.internal'
def kineticFeaturePackage = 'dev.xyat.kineticcore.feature'

def kineticLineNumber = { String source, int index ->
    int end = Math.max(0, Math.min(index, source.length()))
    int line = 1
    for (int i = 0; i < end; i++) {
        if (source.charAt(i) == '\n'.charAt(0)) line++
    }
    line
}

def kineticMaskJavaSource = { String source ->
    StringBuilder out = new StringBuilder(source.length())
    int i = 0
    int state = 0
    while (i < source.length()) {
        char ch = source.charAt(i)
        if (state == 0) {
            if (i + 1 < source.length() && source.startsWith('//', i)) {
                out.append('  ')
                i += 2
                state = 1
            } else if (i + 1 < source.length() && source.startsWith('/*', i)) {
                out.append('  ')
                i += 2
                state = 2
            } else if (i + 2 < source.length() && source.startsWith('"""', i)) {
                out.append('   ')
                i += 3
                state = 5
            } else if (ch == '"'.charAt(0)) {
                out.append(' ')
                i++
                state = 3
            } else if (ch == '\''.charAt(0)) {
                out.append(' ')
                i++
                state = 4
            } else {
                out.append(ch)
                i++
            }
        } else if (state == 1) {
            if (ch == '\n'.charAt(0)) {
                out.append('\n')
                state = 0
            } else {
                out.append(' ')
            }
            i++
        } else if (state == 2) {
            if (i + 1 < source.length() && source.startsWith('*/', i)) {
                out.append('  ')
                i += 2
                state = 0
            } else {
                out.append(ch == '\n'.charAt(0) ? '\n' : ' ')
                i++
            }
        } else if (state == 3) {
            if (ch == '\\'.charAt(0) && i + 1 < source.length()) {
                out.append(' ')
                out.append(source.charAt(i + 1) == '\n'.charAt(0) ? '\n' : ' ')
                i += 2
            } else if (ch == '"'.charAt(0)) {
                out.append(' ')
                i++
                state = 0
            } else {
                out.append(ch == '\n'.charAt(0) ? '\n' : ' ')
                i++
            }
        } else if (state == 4) {
            if (ch == '\\'.charAt(0) && i + 1 < source.length()) {
                out.append(' ')
                out.append(source.charAt(i + 1) == '\n'.charAt(0) ? '\n' : ' ')
                i += 2
            } else if (ch == '\''.charAt(0)) {
                out.append(' ')
                i++
                state = 0
            } else {
                out.append(ch == '\n'.charAt(0) ? '\n' : ' ')
                i++
            }
        } else {
            if (ch == '\\'.charAt(0) && i + 1 < source.length()) {
                out.append(' ')
                out.append(source.charAt(i + 1) == '\n'.charAt(0) ? '\n' : ' ')
                i += 2
            } else if (i + 2 < source.length() && source.startsWith('"""', i)) {
                out.append('   ')
                i += 3
                state = 0
            } else {
                out.append(ch == '\n'.charAt(0) ? '\n' : ' ')
                i++
            }
        }
    }
    out.toString()
}

def kineticMatchingBrace = { String source, int openIndex ->
    int depth = 0
    for (int i = openIndex; i < source.length(); i++) {
        char ch = source.charAt(i)
        if (ch == '{'.charAt(0)) depth++
        if (ch == '}'.charAt(0)) {
            depth--
            if (depth == 0) return i
        }
    }
    source.length() - 1
}

def kineticHasOverrideBefore = { String source, int declarationIndex ->
    int start = Math.max(0, declarationIndex - 500)
    String prefix = source.substring(start, declarationIndex)
    prefix ==~ /(?s).*@Override(?:\s|@[A-Za-z0-9_.$]+(?:\([^\n]*\))?)*$/
}

def kineticHasJavadocBefore = { List<String> lines, int lineIndex ->
    int cursor = lineIndex - 1
    boolean sawOverride = false
    while (cursor >= 0) {
        String trimmed = lines[cursor].trim()
        if (trimmed.isEmpty()) {
            cursor--
            continue
        }
        if (trimmed.startsWith('@')) {
            if (trimmed.startsWith('@Override')) sawOverride = true
            cursor--
            continue
        }
        if (sawOverride) return true
        return trimmed.endsWith('*/')
    }
    false
}

def internalImportPattern = Pattern.compile('(?m)^\\s*import\\s+dev\\.xyat\\.kineticcore\\.internal(?:\\.[A-Za-z0-9_$.*]+)?\\s*;')
def publicDeclarationPattern = Pattern.compile('(?s)\\b(public|protected)\\b[^;{]*[;{]')

def apiLowLevelPatterns = [
        'Minecraft.getInstance()',
        'ForgeRegistries',
        'BuiltInRegistries',
        'FMLPaths',
        'DistExecutor',
        'FluidUtil',
        'RenderSystem',
        'GLFW',
        '@SubscribeEvent',
        '@Mod.EventBusSubscriber'
]

tasks.register('checkKineticApiSurface') {
    group = 'verification'
    description = 'Checks the public Kinetic API surface before Java compilation.'

    inputs.files(fileTree(kineticApiRoot) { include '**/*.java' })

    doLast {
        def violations = []

        if (!kineticApiRoot.exists()) {
            throw new GradleException("Kinetic API source root does not exist: ${kineticApiRoot}")
        }

        fileTree(kineticApiRoot) {
            include '**/*.java'
        }.files.sort { it.absolutePath }.each { File javaFile ->
            String source = javaFile.getText('UTF-8')
            String normalized = javaFile.absolutePath.replace('\\', '/')
            String relative = project.relativePath(javaFile)
            List<String> lines = source.readLines()

            if (source.contains(kineticFeaturePackage)) {
                violations.add("API -> FEATURE is forbidden: ${relative}")
            }

            if (source.contains('import net.minecraftforge.client.event.')
                    || source.contains('import net.minecraftforge.event.')
                    || source.contains('import net.minecraftforge.fml.event.')) {
                violations.add("API must not import Forge event implementation types: ${relative}")
            }

            apiLowLevelPatterns.each { String pattern ->
                if (source.contains(pattern)) {
                    violations.add("API low-level implementation bypass is forbidden: ${relative} -> ${pattern}")
                }
            }

            if (source.contains('Component.translatable(')
                    && !normalized.endsWith('/dev/xyat/kineticcore/api/text/KineticI18n.java')) {
                violations.add("API translations must go through KineticI18n: ${relative}")
            }

            if ((source.contains('new ResourceLocation(') || source.contains('ResourceLocation.tryParse('))
                    && !normalized.endsWith('/dev/xyat/kineticcore/api/resource/KineticResourceIds.java')) {
                violations.add("API resource IDs must go through KineticResourceIds: ${relative}")
            }

            Set<String> importedInternalTypes = [] as Set
            def internalMatcher = internalImportPattern.matcher(source)
            while (internalMatcher.find()) {
                String importLine = internalMatcher.group()
                if (!importLine.contains('.*')) {
                    String qualified = importLine.replaceFirst('(?s)^\\s*import\\s+', '').replaceFirst('\\s*;\\s*$', '')
                    importedInternalTypes.add(qualified.substring(qualified.lastIndexOf('.') + 1))
                }
            }

            def fullyQualifiedLeak = Pattern.compile('(?s)\\b(public|protected)\\b[^;{]*dev\\.xyat\\.kineticcore\\.internal[^;{]*[;{]').matcher(source)
            while (fullyQualifiedLeak.find()) {
                violations.add("API exposes an internal type: ${relative} -> ${fullyQualifiedLeak.group().replaceAll('\\s+', ' ').trim()}")
            }

            def declarationMatcher = publicDeclarationPattern.matcher(source)
            while (declarationMatcher.find()) {
                String declaration = declarationMatcher.group()
                importedInternalTypes.each { String simpleName ->
                    if (declaration.matches("(?s).*\\b${Pattern.quote(simpleName)}\\b.*")) {
                        violations.add("API signature exposes internal type '${simpleName}': ${relative} -> ${declaration.replaceAll('\\s+', ' ').trim()}")
                    }
                }
            }

            for (int i = 0; i < lines.size(); i++) {
                String trimmed = lines[i].trim()
                if (!(trimmed ==~ /^(public|protected)\\b.*/)) continue
                if (!kineticHasJavadocBefore(lines, i)) {
                    violations.add("Public/protected API declaration needs JavaDoc: ${relative}:${i + 1} -> ${trimmed}")
                }
            }

            String masked = kineticMaskJavaSource(source)
            def typeRanges = []
            def typeMatcher = Pattern.compile('(?s)\\b(class|interface|enum|record)\\s+([A-Za-z_$][A-Za-z0-9_$]*)[^;{}]*\\{').matcher(masked)
            while (typeMatcher.find()) {
                int bodyStart = typeMatcher.end() - 1
                int bodyEnd = kineticMatchingBrace(masked, bodyStart)
                typeRanges.add([
                        name : typeMatcher.group(2),
                        start: bodyStart,
                        end  : bodyEnd
                ])
            }

            def callableSignatures = [:].withDefault { [] }
            def accessMatcher = Pattern.compile('(?m)^\\s*(public|protected)\\b').matcher(masked)
            while (accessMatcher.find()) {
                int declarationStart = accessMatcher.start()
                if (kineticHasOverrideBefore(source, declarationStart)) continue

                int limit = Math.min(masked.length(), declarationStart + 1800)
                String candidate = masked.substring(declarationStart, limit)
                int parenDepth = 0
                int terminator = -1
                for (int offset = 0; offset < candidate.length(); offset++) {
                    char ch = candidate.charAt(offset)
                    if (ch == '('.charAt(0)) parenDepth++
                    if (ch == ')'.charAt(0) && parenDepth > 0) parenDepth--
                    if (parenDepth == 0 && (ch == '{'.charAt(0) || ch == ';'.charAt(0))) {
                        terminator = offset + 1
                        break
                    }
                }
                if (terminator < 0) continue

                String declaration = candidate.substring(0, terminator)
                int firstParen = declaration.indexOf('(')
                if (firstParen < 0) continue
                int lastParen = declaration.lastIndexOf(')')
                if (lastParen < firstParen) continue

                String beforeParen = declaration.substring(0, firstParen)
                if (beforeParen.contains('=')) continue
                if (beforeParen ==~ /(?s).*\\b(class|interface|enum|record)\\b.*/) continue

                def nameMatcher = Pattern.compile('([A-Za-z_$][A-Za-z0-9_$]*)\\s*$').matcher(beforeParen)
                if (!nameMatcher.find()) continue
                String callableName = nameMatcher.group(1)
                String parameterSignature = declaration.substring(firstParen + 1, lastParen)
                        .replaceAll('\\s+', ' ')
                        .trim()

                def owners = typeRanges.findAll { Map range ->
                    declarationStart > (range.start as int) && declarationStart < (range.end as int)
                }
                if (owners.isEmpty()) continue
                Object owner = owners.min { Map range -> (range.end as int) - (range.start as int) }
                String key = "${owner.start}|${owner.name}|${callableName}|${parameterSignature}"
                callableSignatures[key].add(kineticLineNumber(source, declarationStart))
            }

            callableSignatures.each { String key, List<Integer> declarationLines ->
                if (declarationLines.size() > 1) {
                    String[] parts = key.split('\\|', 4)
                    String ownerName = parts.length > 1 ? parts[1] : "<unknown>"
                    String callableName = parts.length > 2 ? parts[2] : "<unknown>"
                    String parameterSignature = parts.length > 3 ? parts[3] : ""
                    violations.add("Duplicate public/protected callable signature '${ownerName}.${callableName}(${parameterSignature})' is forbidden: ${relative} lines ${declarationLines.join(', ')}")
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Kinetic public API verification failed:\n - " + violations.unique().join('\n - ')
                            + "\n\nRules:\n"
                            + "  explicit public/protected API declarations require JavaDoc\n"
                            + "  public/protected overloads are allowed; duplicate callable signatures are forbidden\n"
                            + "  public/protected API signatures must not expose internal implementation types\n"
                            + "  API must not depend on feature packages or Forge event implementation types\n"
                            + "  low-level platform access belongs in internal implementations behind the public API\n"
                            + "  Component.translatable and ResourceLocation construction/parsing have one public facade each"
            )
        }
    }
}

tasks.matching { it.name == 'compileJava' }.configureEach {
    dependsOn tasks.named('checkKineticApiSurface')
}

tasks.register('checkKineticWidgetState', JavaExec) {
    group = 'verification'
    description = 'Checks the current public widget state implementations without starting Minecraft.'
    dependsOn tasks.named('testClasses')
    classpath = files(sourceSets.test.output, sourceSets.main.output)
    mainClass.set('dev.xyat.kineticcore.api.client.widget.WidgetStateRegression')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.register('checkKineticPinyin', JavaExec) {
    group = 'verification'
    description = 'Checks KineticCore built-in pinyin indexing and search behavior without starting Minecraft.'
    dependsOn tasks.named('testClasses')
    classpath = files(sourceSets.test.output, sourceSets.main.output)
    mainClass.set('dev.xyat.kineticcore.internal.client.search.PinyinTransliterationRegression')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.named('check').configure {
    dependsOn tasks.named('checkKineticApiSurface')
    dependsOn tasks.named('checkKineticWidgetState')
    dependsOn tasks.named('checkKineticPinyin')
}
