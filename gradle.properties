org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
org.gradle.caching=true
org.gradle.jvmargs=-Xmx3G -XX:+UseG1GC -Dfile.encoding=UTF-8

# Shared by every Minecraft version. Version-specific values (Minecraft, loader, Java, pack format)
# live in versions/<node>/gradle.properties.
mod_id=kineticcore
mod_name=KineticCore
mod_license=LGPLv3
mod_version=26.9.22
mod_group_id=dev.xyat.kineticcore
mod_authors=XYAT
mod_description=kineticcore
use_auto_version=true
# A distinct version for API additions made after the day's first release.
release_revision_date=26.10.10
release_revision=3
output_mods_dir=D:/NEWMODS

# The build scripts stay in Groovy so the existing check scripts in gradle/ keep working.
dev.kikugie.stonecutter.hard_mode=true
