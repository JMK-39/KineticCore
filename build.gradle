buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.24'
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
}

def requiredGradleVersion = org.gradle.util.GradleVersion.version('8.8')
if (org.gradle.util.GradleVersion.current() != requiredGradleVersion) {
    throw new GradleException("KineticCore requires Gradle 8.8 exactly. Current Gradle: ${org.gradle.util.GradleVersion.current().version}")
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

configurations.configureEach {
    resolutionStrategy.cacheDynamicVersionsFor 99999, 'days'
    resolutionStrategy.cacheChangingModulesFor 99999, 'days'
}

def getDynamicVersion() {
    def useAuto = project.findProperty('use_auto_version')?.toString() ?: 'false'
    if (useAuto.toBoolean()) {
        return new java.text.SimpleDateFormat("yy.M.d").format(new Date())
    } else {
        return project.findProperty('mod_version')?.toString() ?: "0.0.0"
    }
}

def pVersion = getDynamicVersion()
def pGroup = project.findProperty('mod_group_id')?.toString() ?: "dev.xyat.kineticcore"
def pModId = project.findProperty('mod_id')?.toString() ?: "kineticcore"

version = pVersion
group = pGroup

base {
    archivesName.set(pModId)
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def mixinConfigList = fileTree(
        dir: 'src/main/resources',
        include: 'kineticcore.mixins*.json'
).files.collect { File file -> file.name }.sort()

minecraft {
    mappings channel: project.findProperty('mapping_channel')?.toString() ?: 'official',
            version: project.findProperty('mapping_version')?.toString()
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${pModId}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', pModId
            if (!mixinConfigList.isEmpty()) {
                mixinConfigList.each { configName ->
                    args "-mixin.config=${configName}"
                }
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', pModId
            args '--nogui'
            if (!mixinConfigList.isEmpty()) {
                mixinConfigList.each { configName ->
                    args "-mixin.config=${configName}"
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "${pModId}.mixins.refmap.json"
    mixinConfigList.each { configName ->
        config configName
    }
}

// Mixin's annotation processor writes this side output outside JavaCompile's
// class directory. Declare it so Gradle restores the runtime refmap from cache.
tasks.named('compileJava', JavaCompile).configure {
    outputs.file(layout.buildDirectory.file("tmp/compileJava/${pModId}.mixins.refmap.json"))
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.blamejared.com' }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}


dependencies {
    minecraft "net.minecraftforge:forge:${project.findProperty('minecraft_version')?.toString()}-${project.findProperty('forge_version')?.toString()}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.5")
    implementation fg.deobf("io.github.llamalad7:mixinextras-forge:0.3.5")

    compileOnly fg.deobf("maven.modrinth:curios:IPQlZkz1")
    compileOnly fg.deobf("maven.modrinth:jei:RTFeXsvE")
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : project.findProperty('minecraft_version')?.toString(),
            minecraft_version_range: project.findProperty('minecraft_version_range')?.toString(),
            forge_version          : project.findProperty('forge_version')?.toString(),
            forge_version_range    : project.findProperty('forge_version_range')?.toString(),
            loader_version_range   : project.findProperty('loader_version_range')?.toString(),
            mod_id                 : pModId,
            mod_name               : project.findProperty('mod_name')?.toString(),
            mod_license            : project.findProperty('mod_license')?.toString(),
            mod_version            : pVersion,
            mod_authors            : project.findProperty('mod_authors')?.toString(),
            mod_description        : project.findProperty('mod_description')?.toString()
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [
                project: project,
                file   : [jarVersion: pVersion]
        ]
    }
}

tasks.named('jar', Jar).configure {
    def customOutputDir = project.findProperty('output_mods_dir')
    if (customOutputDir) {
        def outputPath = customOutputDir.toString()
        def windowsAbsolutePath = outputPath.length() >= 3
                && Character.isLetter(outputPath.charAt(0))
                && outputPath.charAt(1) == ':'
                && (outputPath.charAt(2) == '/' || outputPath.charAt(2) == '\\')
        def runningOnWindows = System.getProperty('os.name').toLowerCase().contains('windows')

        // The shared Windows output directory is not a valid path on Linux CI runners.
        // Keep the configured path on Windows and use Gradle's normal output directory elsewhere.
        if (windowsAbsolutePath && !runningOnWindows) {
            destinationDirectory.set(layout.buildDirectory.dir('libs'))
        } else {
            destinationDirectory.set(file(outputPath))
        }
    }

    archiveFileName.set("${pModId}-${project.version}.jar")

    manifest {
        attributes([
                'Specification-Title'       : pModId,
                'Specification-Vendor'      : project.findProperty('mod_authors')?.toString() ?: "Unknown",
                'Specification-Version'     : '1',
                'Implementation-Title'      : project.name,
                'Implementation-Version'    : pVersion,
                'Implementation-Vendor'     : project.findProperty('mod_authors')?.toString() ?: "Unknown",
                'Implementation-Timestamp'  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'              : mixinConfigList.join(',')
        ])
    }

    finalizedBy 'reobfJar'
}

reobf {
    jar {}
}

tasks.register('runClientIDE') {
    group = 'build'
    description = 'Start Forge development client (wrapper around runClient)'
    dependsOn 'runClient'
}

tasks.register('runServerIDE') {
    group = 'build'
    description = 'Start Forge development server (wrapper around runServer)'
    dependsOn 'runServer'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-nowarn', '-Xlint:none', '-Amixin.target.allowUnresolvedTarget=true', '-Amixin.suppressTargetWarnings=true'])
}

def kineticApiJavadoc = tasks.register('kineticApiJavadoc', Javadoc) {
    group = 'documentation'
    description = 'Generates browsable Javadoc for the public Kinetic API.'

    source = fileTree('src/main/java') {
        include 'dev/xyat/kineticcore/api/**/*.java'
    }
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDir = layout.projectDirectory.dir('javadoc').asFile

    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.windowTitle = "KineticCore ${project.version} API"
    options.docTitle = "KineticCore ${project.version} API"
    options.addBooleanOption('Xdoclint:none', true)
    options.quiet()
    options.addStringOption('sourcepath', file('src/main/java').absolutePath)
    failOnError = true

    onlyIf {
        def compileTask = tasks.named('compileJava').get()
        compileTask.state.failure == null
    }
}

// This task is opt-in: normal build/compileJava must not generate Javadoc.
tasks.register('buildJavaDOC', Zip) {
    group = 'build'
    description = 'Generate public KineticCore API Javadoc and package it as a shareable ZIP.'
    dependsOn kineticApiJavadoc

    archiveFileName.set("KineticCore-javadoc-${project.version}.zip")
    destinationDirectory.set(layout.projectDirectory)
    from(layout.projectDirectory.dir('javadoc')) {
        into 'javadoc'
    }
}

apply from: 'gradle/kinetic-architecture.gradle'
apply from: 'gradle/kinetic-api-verification.gradle'
