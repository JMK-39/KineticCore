name: Manual Mod Release

on:
  workflow_dispatch:
    inputs:
      mod_version:
        description: Release version in YY.M.D or YY.M.D.revision format
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Gradle runs on Java 21. 1.20.1 and 1.21.1 compile for Java 21; 26.1.2 compiles for Java 25, which Gradle
      # downloads through the foojay toolchain resolver in settings.gradle.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Validate version format
        env:
          VERSION: ${{ inputs.mod_version }}
        run: |
          python - <<'PY'
          from datetime import datetime
          import os
          import re
          version = os.environ["VERSION"]
          if not re.fullmatch(r"\d{2}\.(?:[1-9]|1[0-2])\.(?:[1-9]|[12]\d|3[01])(?:\.[1-9]\d*)?", version):
              raise SystemExit("Version must use YY.M.D or YY.M.D.revision without leading zeroes")
          datetime.strptime(".".join(version.split(".")[:3]), "%y.%m.%d")
          PY

      # Builds one JAR per enabled Minecraft version: kineticcore-<loader>-<minecraft>-<version>.jar.
      - name: Build mod JARs
        env:
          VERSION: ${{ inputs.mod_version }}
        run: >-
          gradle buildAll --no-daemon --stacktrace
          -Puse_auto_version=false
          -Pmod_version="$VERSION"
          -Poutput_mods_dir=build/release

      - name: Check release artifacts
        env:
          VERSION: ${{ inputs.mod_version }}
        run: |
          shopt -s nullglob
          artifacts=(build/release/kineticcore-*-"$VERSION".jar)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No release JARs in build/release" >&2
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            test -s "$artifact"
            echo "$artifact"
          done

      - name: Publish GitHub Release
        env:
          VERSION: ${{ inputs.mod_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          artifacts=(build/release/kineticcore-*-"$VERSION".jar)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${artifacts[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${artifacts[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "KineticCore $VERSION" \
              --generate-notes
          fi
