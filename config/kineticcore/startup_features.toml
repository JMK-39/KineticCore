# KineticCore startup feature switches
# Stable feature IDs are used here. Restart the game/server after changing a value.

# [movement]
movement.flight_server = true
movement.flight_client = false
player.crawling = true

# [world]
world.spawn_override = true
world.management = true

# [entity]
entity.bee_logic = true
entity.bee_render = true
entity.despawn_rules = true

# [vanilla]
vanilla.recipe_book_server = true
vanilla.recipe_book_client = true
attributes.range_limits = true

# [monitoring]
monitoring.tps = true

# [performance]
performance.damage_indicator_particles = true
performance.gpu_cleanup = true

# [client]
client.copy_item_container_access = true
client.default_options = true
client.interface_automation = true
client.status_effect_hud = true

# [network]
network.protocol_limits = true

# [custom]
custom.failure = true
